server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

	resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ /\. { deny all; }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # WebSocket к FastAPI
	location /ws {
		set $upstream_ws http://fastapi:8000;
		proxy_pass $upstream_ws/ws;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 86400;
	}

    # REST API к FastAPI
    location /api/ {
        set $upstream_ws http://fastapi:8000;
        proxy_pass         $upstream_ws;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Всё остальное — Laravel через PHP-FPM
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_php laravel:9000;
        fastcgi_pass   $upstream_php;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    access_log /var/log/nginx/boardy-access.log;
    error_log  /var/log/nginx/boardy-error.log;
}