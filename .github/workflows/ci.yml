name: CI
 
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
 
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: |
          find src -name "*.php" -print0 | \
          xargs -0 -n1 php -l
      - name: Python syntax check
        run: |
          python -m compileall api/ -q
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env files
        run: |
          cat > .env <<EOF
          DB_USER=boardy
          DB_PASSWORD=ci_password
          MYSQL_ROOT_PASSWORD=ci_root_password
          EOF

          cat > boardy/.env <<EOF
          APP_NAME=Boardy
          APP_ENV=testing
          APP_DEBUG=true
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_URL=http://localhost
          SESSION_DRIVER=file
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=boardy
          DB_USERNAME=boardy
          DB_PASSWORD=ci_password
          REDIS_HOST=redis
          EOF

      - name: Install Laravel deps
        working-directory: ./boardy
        run: composer install --no-interaction --prefer-dist --no-scripts
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: |
          docker compose up -d
          for i in {1..30}; do
            curl -fs http://localhost/health && break
            sleep 2
          done
      - name: Smoke endpoints
        run: |
          curl -f http://localhost/health
          curl -f http://localhost/api/health
      - name: Tear down
        if: always()
        run: docker compose down -v

